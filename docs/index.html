<!doctype html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<link rel="icon" href="logo-copaf.jpg">
<title>COPAF · Gestão do Abatedouro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root { --bg:#f4f5f2; --card:#fff; --ink:#1d2a22; --mut:#66736b; --line:#dfe3dc; --pri:#0f8a41; --pri2:#e5f4eb; --warn:#b4541a; --err:#b3261e; --red:#ec1f27; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#fff; color:var(--ink); border-bottom:3px solid var(--pri); padding:8px 20px; display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
  header img { height:46px; display:block; }
  nav { display:flex; gap:4px; flex:1; }
  nav button { background:transparent; color:var(--ink); border:0; padding:8px 14px; border-radius:6px; font:inherit; cursor:pointer; }
  nav button.on { background:var(--pri); color:#fff; font-weight:600; }
  header .user { font-size:12px; color:var(--mut); }
  main { max-width:1180px; margin:0 auto; padding:18px 16px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px 12px; }
  label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--mut); }
  input, select { font:inherit; padding:7px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); min-width:0; }
  input:disabled, select:disabled { background:#f1f2ef; }
  button.b { font:inherit; padding:7px 14px; border-radius:6px; border:1px solid var(--pri); background:var(--pri); color:#fff; cursor:pointer; }
  button.b.sec { background:#fff; color:var(--pri); }
  button.b.warn { border-color:var(--warn); background:#fff; color:var(--warn); }
  button.lnk { background:none; border:0; color:var(--pri); cursor:pointer; font:inherit; padding:0 4px; text-decoration:underline; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { font-size:12px; color:var(--mut); font-weight:600; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .scroll { overflow-x:auto; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .kpi { background:var(--pri2); border-radius:8px; padding:10px 12px; }
  .kpi small { display:block; color:var(--mut); font-size:11px; }
  .kpi b { font-size:17px; font-variant-numeric:tabular-nums; }
  .kpi.big { background:var(--pri); color:#fff; } .kpi.big small { color:#cfe5d8; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; background:#fdecdc; color:var(--warn); }
  .tag.ok { background:var(--pri2); color:var(--pri); }
  .tag.az { background:#e3eefc; color:#1c4f9c; }
  .checks { display:flex; gap:14px; flex-wrap:wrap; align-items:center; font-size:13px; }
  .checks label { flex-direction:row; align-items:center; gap:5px; font-size:13px; color:var(--ink); }
  .aviso { background:#fff6e9; border-color:#f0c48a; color:#7a3d0c; }
  .msg { color:var(--err); margin:8px 0 0; min-height:1em; }
  .mut { color:var(--mut); }
  #login { max-width:340px; margin:12vh auto; }
  #login label { margin-bottom:10px; }
  #rel { display:none; }
  @media print {
    header, main { display:none !important; }
    #rel { display:block; padding:0 8mm; color:#000; }
    #rel.etqs { padding:0; }
    #rel .cab { font-size:11px; line-height:1.4; } #rel .cab b { font-size:12px; }
    #rel .gov { text-align:center; font-size:10px; line-height:1.35; } #rel h3 { text-align:center; font-size:13px; margin:14px 0 8px; }
    #rel table.gr td, #rel table.gr th { border:1px solid #000; padding:3px 5px; font-size:11px; white-space:normal; } #rel table.gr th { background:#d9e6c3; }
    #rel h1 { font-size:18px; margin:0; } #rel h2 { font-size:13px; margin:18px 0 6px; border-bottom:1px solid #000; padding-bottom:3px; }
    #rel td, #rel th { border-bottom:1px solid #bbb; padding:4px 6px; }
    /* a etiqueta não herda o espaçamento das tabelas de relatório */
    #rel .etq table.nut td, #rel .etq table.nut th { padding:.4mm .8mm; border:.25mm solid #000; }
    #rel .etq table.nut th.t { border-bottom:0; padding-bottom:0; }
    #rel .etq table.nut td.sub { border-top:0; border-bottom:0; padding:0 .8mm; }
    #rel .tot td { font-weight:700; border-top:2px solid #000; }
    #rel .relaviso { border:2px solid #000; padding:8px 10px; margin:14px 0 0; }
    #rel .pg-cab { display:flex; gap:14px; align-items:center; font-size:9.5px; line-height:1.35; border-bottom:1px solid #000; padding-bottom:6px; }
    #rel .pg-logo { display:flex; gap:8px; align-items:center; flex:1.3; } #rel .pg-logo img { height:68px; }
    #rel .pg-unid { flex:1; border-left:1.5px solid #000; padding-left:8px; }
    #rel .pg-tit { text-align:center; font-size:13px; margin:12px 0 4px; }
    #rel table.pg { width:100%; border-collapse:collapse; } #rel table.pg td, #rel table.pg th { border:1.5px solid #000; padding:2px 5px; height:11mm; font-size:12px; text-transform:uppercase; white-space:normal; }
    #rel table.pg th { height:auto; background:#9bbb59; text-align:center; font-weight:700; } #rel table.pg td.c { text-align:center; font-weight:700; }
    #rel table.pg tr.pg-tot td { height:8mm; font-weight:700; background:#eef3e4; }
    #rel .assin { display:flex; gap:40px; margin-top:60px; } #rel .assin div { flex:1; border-top:1px solid #000; padding-top:4px; text-align:center; font-size:12px; }
    #rel .previa { border:2px dashed #000; padding:4px 10px; font-weight:700; display:inline-block; }
  }
  .etq { width:105mm; height:75mm; box-sizing:border-box; padding:3mm 4mm 2mm; font-family:Arial,Helvetica,sans-serif; color:#000; background:#fff; display:flex; flex-direction:column; overflow:hidden; page-break-after:always; break-after:page; }
  .etq .nm { text-align:center; font-weight:700; font-size:13pt; letter-spacing:.4px; line-height:1.1; }
  .etq .mid { flex:1; display:flex; gap:3mm; margin-top:1.5mm; min-height:0; overflow:hidden; }
  .etq .esq { width:54mm; }
  .etq table.nut { width:100%; border-collapse:collapse; font-size:6.4pt; line-height:1.12; }
  .etq table.nut td, .etq table.nut th { border:.25mm solid #000; padding:.4mm .8mm; white-space:nowrap; text-align:left; color:#000; font-weight:400; }
  .etq table.nut th.t { text-align:center; font-weight:700; font-size:8.4pt; border-bottom:0; padding-bottom:0; }
  .etq table.nut td.sub { text-align:center; font-weight:700; border-top:0; border-bottom:0; padding:0 .8mm; }
  .etq table.nut td.c { text-align:center; }
  .etq .rod { font-size:5pt; margin-top:.5mm; }
  .etq .dir { flex:1; display:flex; flex-direction:column; justify-content:center; font-size:9.5pt; line-height:1.35; min-width:0; }
  .etq .dir svg { width:100%; height:auto; margin-top:1.5mm; }
  .etq .pl { text-align:center; font-weight:700; font-size:11pt; letter-spacing:.3px; }
  .previa-etq { display:inline-block; border:1px dashed var(--mut); border-radius:4px; }
</style>
<style id="pgStyle"></style>
</head>
<body>
<div id="login" class="card" hidden>
  <img src="logo-copaf.jpg" alt="COPAF" style="width:150px;display:block;margin:0 auto 4px">
  <p class="mut" style="text-align:center;margin:0 0 14px">Gestão do Abatedouro</p>
  <form id="fLogin">
    <label>E-mail <input type="email" id="lEmail" required autocomplete="username"></label>
    <label>Senha <input type="password" id="lSenha" required autocomplete="current-password"></label>
    <button class="b" type="submit">Entrar</button>
    <button class="lnk" type="button" id="bPrimeiro" style="margin-left:10px">Primeiro acesso</button>
    <button class="lnk" type="button" id="bEsqueci" style="margin-left:6px">Esqueci a senha</button>
    <p class="msg" id="lMsg"></p>
  </form>
  <form id="fPrimeiro" hidden>
    <p class="mut">Use o e-mail que o administrador autorizou e crie a sua senha. Você receberá um e-mail para confirmar o endereço.</p>
    <label>E-mail <input type="email" id="pEmail" required autocomplete="username"></label>
    <label>Senha (mínimo 8 caracteres) <input type="password" id="pSenha" required minlength="8" autocomplete="new-password"></label>
    <label>Repita a senha <input type="password" id="pSenha2" required minlength="8" autocomplete="new-password"></label>
    <button class="b" type="submit">Criar senha</button>
    <button class="lnk" type="button" id="bVoltar" style="margin-left:10px">Voltar</button>
    <p class="msg" id="pMsg"></p>
  </form>
</div>

<header id="top" hidden>
  <img src="logo-copaf.jpg" alt="COPAF">
  <nav id="nav">
    <button data-tab="dia">Dia de produção</button>
    <button data-tab="mes">Fechamento mensal</button>
    <button data-tab="cam">Câmara fria</button>
    <button data-tab="sie">Relatórios SIE</button>
    <button data-tab="emb">Embalagens</button>
    <button data-tab="desp">Despesas</button>
    <button data-tab="cad">Cadastros</button>
    <button data-tab="usu" id="nvUsu" hidden>Usuários</button>
  </nav>
  <span class="user"><span id="uEmail"></span> · <button class="lnk" id="bSair">sair</button></span>
</header>
<main id="main" hidden></main>
<div id="rel"></div>

<script>
const sb = supabase.createClient('https://kblrhzclhkqilcbcyqnr.supabase.co', 'sb_publishable_rMNN6YoURddBGLcs_fXs5g_LF7DJkwp');
const $ = (s, el = document) => el.querySelector(s);
const main = $('#main');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => v == null ? '—' : Number(v).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const num = (v, d = 0) => v == null ? '—' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits:d, maximumFractionDigits:d });
const dataBR = d => d ? d.split('-').reverse().join('/') : '';
const hoje = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const st = { perfil:null, tab:'dia', data:hoje(), mes:hoje().slice(0, 7), cad:'cooperados', ref:{} };

async function q(p) { const { data, error } = await p; if (error) throw new Error(error.message); return data; }
function falha(e) { alert('Erro: ' + e.message); }

// ───────── impressão ─────────
// pg: regra @page (vazio = A4 retrato); classe: classe aplicada à área de impressão
function imprimir(pg = '', classe = '') {
  $('#pgStyle').textContent = pg; $('#rel').className = classe;
  // espera as imagens (logomarca, códigos de barras) carregarem, senão a impressão sai sem elas
  const imgs = [...$('#rel').querySelectorAll('img')];
  Promise.all(imgs.map(i => i.complete && i.naturalWidth ? null : new Promise(r => { i.onload = i.onerror = r; setTimeout(r, 4000); }))).then(() => window.print());
}

// ───────── formulários genéricos ─────────
function campos(fields, v = {}, dis = false) {
  return fields.map(f => {
    const val = v[f.k] ?? f.def ?? '';
    const at = `name="${f.k}" ${f.req ? 'required' : ''} ${dis ? 'disabled' : ''}`;
    let inp;
    if (f.type === 'select')
      inp = `<select ${at}>${f.req ? '' : '<option value=""></option>'}${f.options().map(([o, l]) => `<option value="${esc(o)}" ${String(o) === String(val) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    else if (f.type === 'checkbox')
      inp = `<input type="checkbox" ${at} ${val === '' ? (f.def === false ? '' : 'checked') : (val ? 'checked' : '')} style="align-self:flex-start">`;
    else
      inp = `<input type="${f.type || 'text'}" ${f.type === 'number' ? `step="${f.step || 'any'}"` : ''} ${at} value="${esc(String(val).slice(0, f.type === 'time' ? 5 : undefined))}">`;
    return `<label>${esc(f.label)}${inp}</label>`;
  }).join('');
}
function ler(form, fields) {
  const o = {};
  for (const f of fields) {
    const el = form.elements[f.k];
    if (f.type === 'checkbox') o[f.k] = el.checked;
    else if (el.value === '') o[f.k] = f.zero ? 0 : null;
    else o[f.k] = (f.type === 'number' || f.int) ? Number(el.value) : el.value;
  }
  return o;
}

// ───────── referências ─────────
async function carregarRef() {
  const [co, mo, ve, fu, ta, pr, re, es, et, ee] = await Promise.all([
    q(sb.from('cooperados').select('*').order('nome')), q(sb.from('motoristas').select('*').order('nome')),
    q(sb.from('veiculos').select('*').order('placa')), q(sb.from('funcionarios').select('*').order('nome')),
    q(sb.from('tipos_ave').select('*').order('codigo')),
    q(sb.from('produtos').select('*').order('ordem')), q(sb.from('rendimentos').select('*')),
    q(sb.from('estabelecimento').select('*').eq('id', 1).maybeSingle()), q(sb.from('etiquetas').select('*')), q(sb.from('etiqueta_eans').select('*'))]);
  st.ref = { cooperados:co, motoristas:mo, veiculos:ve, funcionarios:fu, tipos_ave:ta, produtos:pr, rendimentos:re, estab:es || {}, etiquetas:et, eans:ee };
}
const nomeDe = (lista, id, campo = 'nome') => (st.ref[lista].find(x => x.id === id) || {})[campo] || '—';
const ativos = l => st.ref[l].filter(x => x.ativo !== false);

// ───────── PLANO DE CORTES ─────────
const STATUS = { aberto:'Aberto', em_producao:'Em produção', finalizado:'Finalizado' };
const STATUS_TAG = { aberto:'', em_producao:'az', finalizado:'ok' };
const MIUDOS = [['figado', 'Fígado'], ['moela', 'Moela'], ['coracao', 'Coração'], ['pescoco', 'Pescoço'], ['pe', 'Pé']];
const OPC = {
  peito: { com_osso:'Peito com osso', file:'Filé de peito + sassami' },
  perna: { junta:'Coxa e sobrecoxa (juntas)', separada:'Coxa e sobrecoxa separadas' },
  asa:   { completa:'Asa completa (com ponta)', sem_ponta:'Asa (sem ponta)', tulipa_meio:'Coxinha da asa (tulipa) + meio da asa' } };
function produtosDoPlano(p) {
  if (p.destino === 'inteiro') return ['inteiro_miudos'];
  const r = [];
  if (p.peito === 'com_osso') r.push('peito_osso'); if (p.peito === 'file') r.push('file_peito', 'sassami');
  if (p.perna === 'junta') r.push('coxa_sobrecoxa'); if (p.perna === 'separada') r.push('coxa', 'sobrecoxa');
  if (p.asa === 'completa') r.push('asa_completa'); if (p.asa === 'sem_ponta') r.push('asa'); if (p.asa === 'tulipa_meio') r.push('coxinha_asa', 'meio_asa');
  if (p.dorso) r.push('dorso');
  return r.concat(p.miudos || []);
}
const nomeProduto = c => (st.ref.produtos.find(p => p.codigo === c) || {}).nome || c;
const pctDe = (tipo, prod) => Number((st.ref.rendimentos.find(r => r.tipo_ave === tipo && r.produto === prod) || {}).pct || 0);
const pesoMedio = l => l.peso_liquido_kg && l.aves_recebidas ? l.peso_liquido_kg / l.aves_recebidas : null;
function descPlano(p, tipoAve) {
  if (p.destino === 'inteiro') return tipoAve === 'GL' ? 'Galeto inteiro com miúdos' : 'Frango inteiro com miúdos';
  return produtosDoPlano(p).map(nomeProduto).join(', ') || 'nenhum corte escolhido';
}
// kg previstos por produto: aves do plano × peso médio vivo × rendimento do tipo de ave
function previsao(l, planos) {
  const pm = pesoMedio(l); if (pm == null) return null;
  const tot = {};
  for (const p of planos) for (const c of produtosDoPlano(p)) tot[c] = (tot[c] || 0) + p.aves * pm * pctDe(l.tipo_ave, c) / 100;
  return st.ref.produtos.filter(p => tot[p.codigo] != null).map(p => ({ codigo:p.codigo, nome:p.nome, pct:pctDe(l.tipo_ave, p.codigo), kg:tot[p.codigo] }));
}
function tabelaPrevisao(l, planos) {
  const pv = previsao(l, planos);
  if (!planos.length) return '';
  if (!pv) return '<p class="mut">Lote sem pesagem: não há peso médio para prever os kg por produto.</p>';
  const total = pv.reduce((a, x) => a + x.kg, 0);
  return `<table><tr><th>Produto</th><th class="n">Rendimento (% do peso vivo)</th><th class="n">Previsão (kg)</th></tr>
    ${pv.map(x => `<tr><td>${esc(x.nome)}</td><td class="n">${num(x.pct, 2)}%</td><td class="n">${num(x.kg, 1)}</td></tr>`).join('')}
    <tr class="tot"><td><b>Total previsto</b></td><td></td><td class="n"><b>${num(total, 1)}</b></td></tr></table>`;
}

// ───────── ETIQUETAS ─────────
const NUT = [['energia', 'Valor Energético (kcal)'], ['carboidratos', 'Carboidratos (g)'], ['acucares_totais', 'Açúcares totais (g)'], ['acucares_adicionados', 'Açúcares adicionados (g)'],
  ['proteinas', 'Proteínas (g)'], ['gorduras_totais', 'Gorduras Totais (g)'], ['gorduras_saturadas', 'Gorduras saturadas (g)'], ['gorduras_trans', 'Gorduras trans (g)'], ['fibras', 'Fibras alimentares (g)'], ['sodio', 'Sódio (mg)']];
// valores diários de referência (IN 75/2020); açúcares totais não têm VD
const VDR = { energia:2000, carboidratos:300, acucares_adicionados:50, proteinas:50, gorduras_totais:65, gorduras_saturadas:20, gorduras_trans:2, fibras:25, sodio:2000 };
const nd = v => v == null || v === '' ? '' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits:2 });
const eanValido = e => /^\d{13}$/.test(e) && (10 - [...e.slice(0, 12)].reduce((a, c, i) => a + Number(c) * (i % 2 ? 3 : 1), 0) % 10) % 10 === Number(e[12]);
function ean13Svg(e) {
  if (!eanValido(e)) return '';
  const L = ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011'],
        G = ['0100111', '0110011', '0011011', '0100001', '0011101', '0111001', '0000101', '0010001', '0001001', '0010111'],
        R = ['1110010', '1100110', '1101100', '1000010', '1011100', '1001110', '1010000', '1000100', '1001000', '1110100'],
        P = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'][Number(e[0])];
  let bits = '101'; for (let i = 0; i < 6; i++) bits += (P[i] === 'L' ? L : G)[Number(e[i + 1])];
  bits += '01010'; for (let i = 0; i < 6; i++) bits += R[Number(e[i + 7])]; bits += '101';
  const guarda = i => i < 3 || (i >= 45 && i < 50) || i >= 92; let r = '';
  for (let i = 0; i < 95; i++) if (bits[i] === '1') r += `<rect x="${11 + i}" y="0" width="1.02" height="${guarda(i) ? 62 : 56}"/>`;
  const txt = (x, t) => `<text x="${x}" y="66" font-size="9" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">${t}</text>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 117 68" shape-rendering="crispEdges" fill="#000">${r}${txt(5, e[0])}${txt(35, e.slice(1, 7).split('').join(' '))}${txt(82, e.slice(7).split('').join(' '))}</svg>`;
}
const eanDe = (produto, cooperado) => (st.ref.eans.find(x => x.produto === produto && x.cooperado_id === cooperado) || {}).ean || '';
// d: { modelo (linha de etiquetas), lote, fab, val, ean }
function etiquetaHtml(d) {
  const m = d.modelo, n = m.nutrientes || {}, porc = m.porcao_g ? Number(m.porcao_g) : null;
  return `<div class="etq"><div class="nm">( ${esc(m.nome_impresso)} )</div>
    <div class="mid"><div class="esq"><table class="nut">
      <tr><th class="t" colspan="4">INFORMAÇÃO NUTRICIONAL</th></tr>
      <tr><td class="sub" colspan="4">${m.porcoes_emb ? 'Porções por emb. ' + esc(m.porcoes_emb) : '&nbsp;'}</td></tr>
      <tr><td class="sub" colspan="4" style="border-bottom:.25mm solid #000">Porção: ${porc ? nd(porc) + ' g' : ''}${m.porcao_desc ? ' ( ' + esc(m.porcao_desc) + ' )' : ''}</td></tr>
      <tr><td>Quantidade por porção</td><td class="c">100 g</td><td class="c">${porc ? nd(porc) + ' g' : ''}</td><td class="c">%VD(*)</td></tr>

// ───────── PESAGEM DE SAÍDA ─────────
function avesPorProduto(planos) { const a = {}; for (const p of planos) for (const c of produtosDoPlano(p)) a[c] = (a[c] || 0) + p.aves; return a; }
// por produto: previsto pelo plano, pesado na saída e rendimento real (kg pesados ÷ kg vivos destinados ao produto)
function comparativo(l, planos, pesagens) {
  const pm = pesoMedio(l), aves = avesPorProduto(planos), real = {};
  for (const w of pesagens) real[w.produto] = (real[w.produto] || 0) + Number(w.peso_kg);
  return st.ref.produtos.filter(p => aves[p.codigo] != null || real[p.codigo] != null).map(p => {
    const vivo = pm != null && aves[p.codigo] ? aves[p.codigo] * pm : null, pct = pctDe(l.tipo_ave, p.codigo), r = real[p.codigo] ?? null;
    return { codigo:p.codigo, nome:p.nome, foraDoPlano:aves[p.codigo] == null, prev: vivo != null ? vivo * pct / 100 : null, real:r, pctPrev:pct, pctReal: r != null && vivo ? 100 * r / vivo : null };
  });
}
function tabelaComparativo(l, planos, pesagens, editavel = false) {
  const c = comparativo(l, planos, pesagens); if (!c.length) return '';
  const tp = c.reduce((a, x) => a + (x.prev || 0), 0), tr = c.reduce((a, x) => a + (x.real || 0), 0);
  const dif = x => x.real == null || x.prev == null ? '—' : (x.real - x.prev >= 0 ? '+' : '') + num(x.real - x.prev, 1);
  return `<table><tr><th>Produto</th><th class="n">Previsto (kg)</th><th class="n">Pesado (kg)</th><th class="n">Diferença (kg)</th><th class="n">Rend. previsto</th><th class="n">Rend. real</th>${editavel ? '<th></th>' : ''}</tr>
    ${c.map(x => `<tr><td>${esc(x.nome)}${x.foraDoPlano ? ' <span class="tag">fora do plano</span>' : ''}</td><td class="n">${x.prev == null ? '—' : num(x.prev, 1)}</td><td class="n">${x.real == null ? '<span class="mut">a pesar</span>' : num(x.real, 1)}</td><td class="n">${dif(x)}</td><td class="n">${num(x.pctPrev, 2)}%</td><td class="n">${x.pctReal == null ? '—' : num(x.pctReal, 2) + '%'}</td>
      ${editavel ? `<td class="n lanc" data-prod="${x.codigo}"><button class="b sec" style="padding:4px 10px" data-lancar="${x.codigo}">${x.real == null ? 'Lançar peso' : 'Somar peso'}</button> <button class="lnk" data-etq="${x.codigo}">etiquetas</button></td>` : ''}</tr>`).join('')}
    <tr class="tot"><td><b>Total</b></td><td class="n"><b>${tp ? num(tp, 1) : '—'}</b></td><td class="n"><b>${num(tr, 1)}</b></td><td></td><td></td><td class="n"><b>${l.peso_liquido_kg && tr ? num(100 * tr / l.peso_liquido_kg, 2) + '% do peso vivo' : ''}</b></td>${editavel ? '<td></td>' : ''}</tr></table>`;
}

  if (lw && st.proxLancar) { const c = st.proxLancar; st.proxLancar = null; abrirLanc(c); }
  const fW = $('#fPeso');
  if (fW) fW.onsubmit = async e => { e.preventDefault(); try {
    await q(sb.from('lote_pesagens').insert({ lote_id:lw.id, produto:fW.elements.produto.value, conservacao:fW.elements.conservacao.value, peso_kg:Number(fW.elements.peso_kg.value),
      volumes: fW.elements.volumes.value ? Number(fW.elements.volumes.value) : null, observacao:fW.elements.observacao.value.trim() || null }));
    st.ultimoProduto = fW.elements.produto.value; await render(); const n = $('#fPeso'); if (n) { n.elements.produto.value = st.ultimoProduto; n.elements.peso_kg.focus(); } } catch (er) { falha(er); } };
  const fP = $('#fPlano');
  if (fP) {
    const alternaCortes = () => { $('#pCortes').hidden = fP.elements.destino.value === 'inteiro'; };
    fP.elements.destino.onchange = alternaCortes;
    fP.onsubmit = async e => { e.preventDefault(); try {
      const cortes = fP.elements.destino.value === 'cortes';
      const o = { lote_id:lp.id, aves:Number(fP.elements.aves.value), destino:fP.elements.destino.value, conservacao:fP.elements.conservacao.value, observacao:fP.elements.observacao.value.trim() || null,
        peito: cortes ? fP.elements.peito.value || null : null, perna: cortes ? fP.elements.perna.value || null : null, asa: cortes ? fP.elements.asa.value || null : null,
        dorso: cortes && fP.elements.dorso.checked, miudos: cortes ? MIUDOS.map(m => m[0]).filter(v => fP.elements['miudo_' + v].checked) : [] };
      if (cortes && !produtosDoPlano(o).length) return alert('Escolha ao menos um corte para entregar.');
      if (noPlano(lp.id) + o.aves > lp.cabecas_pagantes && !confirm('Com esta linha o plano passa do total de aves do lote. Incluir mesmo assim?')) return;
      await q(sb.from('lote_planos').insert(o)); render(); } catch (er) { falha(er); } };
  }
}

async function abrirDia() {
  try {
    const comp = st.data.slice(0, 7) + '-01';
    await q(sb.from('competencias').upsert({ competencia:comp }, { onConflict:'competencia', ignoreDuplicates:true }));
    const ant = await q(sb.from('dias_producao').select('*').lt('data', st.data).order('data', { ascending:false }).limit(1));
    const a = ant[0] || {};
    await q(sb.from('dias_producao').insert({ data:st.data, tarifa_energia:a.tarifa_energia ?? null, tarifa_agua:a.tarifa_agua ?? null }));
    render();
  } catch (e) { falha(e); }
}

const F_CONTAS = [
  { k:'energia_conta_kwh', label:'Conta de energia (kWh)', type:'number' }, { k:'energia_conta_valor', label:'Conta de energia (R$)', type:'number' },
  { k:'agua_conta_m3', label:'Conta de água (m³)', type:'number' }, { k:'agua_conta_valor', label:'Conta de água (R$)', type:'number' }];

async function telaMes() {
  const comp = st.mes + '-01', [aM, mM] = st.mes.split('-').map(Number), prox = `${mM === 12 ? aM + 1 : aM}-${String(mM === 12 ? 1 : mM + 1).padStart(2, '0')}-01`;
  await q(sb.from('competencias').upsert({ competencia:comp }, { onConflict:'competencia', ignoreDuplicates:true }));
  const [c, dias, sit, despMes, cProx] = await Promise.all([
    q(sb.from('competencias').select('*').eq('competencia', comp).single()),
    q(sb.from('v_custo_dia').select('*').eq('competencia', comp).order('data')),
    q(sb.from('dias_producao').select('data,fechado,f_total,f_estrutura,f_cabecas').eq('competencia', comp)),
    q(sb.from('despesas').select('valor, despesa_categorias(rateia)').gte('data', comp).lt('data', prox)),
    q(sb.from('competencias').select('taxa_estrutura,alvo_estrutura').eq('competencia', prox).maybeSingle())]);
  const soma = (l, fn) => l.reduce((x, y) => x + Number(fn(y) || 0), 0), fechadoDia = d => (sit.find(x => x.data === d) || {}).fechado;
  const fixos = ativos('funcionarios').filter(x => x.vinculo === 'fixo'), abertos = sit.filter(x => !x.fechado).length;
  // prévia com os valores atuais; depois de fechado, vale o que ficou gravado
  const mens = c.fechada ? Number(c.est_mensalistas) : soma(fixos, x => x.salario_mensal);
  const desp = c.fechada ? Number(c.est_despesas) : soma(despMes.filter(x => x.despesa_categorias && x.despesa_categorias.rateia), x => x.valor);
  const enDias = soma(dias, x => x.custo_energia), agDias = soma(dias, x => x.custo_agua);
  const eaInformada = c.energia_conta_valor != null || c.agua_conta_valor != null;
  const ea = c.fechada ? Number(c.est_energia_agua) : (c.energia_conta_valor != null ? Number(c.energia_conta_valor) - enDias : 0) + (c.agua_conta_valor != null ? Number(c.agua_conta_valor) - agDias : 0);
  const real = mens + desp + ea, arr = c.fechada ? Number(c.est_arrecadado) : soma(dias, x => x.custo_estrutura), cab = c.fechada ? Number(c.est_cabecas) : soma(dias, x => x.cabecas_dia);
  const alvo = Number(c.alvo_estrutura || 0), pend = alvo - arr, alvoProx = real + pend;
  const taxaProx = c.fechada && cProx && cProx.taxa_estrutura != null ? Number(cProx.taxa_estrutura) : cab ? Math.max(alvoProx / cab, 0) : null;
  const rs4 = v => v == null ? '—' : 'R$ ' + num(v, 4);
  main.innerHTML = `<div class="card row"><label>Mês <input type="month" id="mMes" value="${st.mes}"></label>
      <span class="tag ${c.fechada ? 'ok' : ''}">${c.fechada ? 'Mês fechado' : 'Mês em aberto'}</span>
      ${c.fechada ? '<button class="b warn" id="bReabrirMes">Reabrir mês</button>' : '<button class="b" id="bFecharMes">Fechar mês e gerar a taxa do mês seguinte</button>'}</div>

  <div class="card"><h2>Como o custo é rateado</h2>
    <p class="mut" style="margin:0">Cada lote paga duas parcelas. <b>Custo direto do dia</b>: diaristas, energia e água medidas, limpeza e outros gastos do dia, divididos pelas cabeças abatidas no dia. <b>Taxa de estrutura</b>: um valor por cabeça igual para todos os lotes do mês, que cobre mensalistas, despesas do menu Despesas e a energia e água fora dos dias de abate. A taxa de um mês é calculada no fechamento do mês anterior, e o que sobra ou falta passa para o mês seguinte.</p></div>

  <div class="card"><h2>Taxa de estrutura em uso neste mês</h2>
    ${c.taxa_estrutura == null ? '<p class="card aviso" style="margin:0 0 12px">Este mês está sem taxa de estrutura: os lotes pagam só o custo direto do dia, e o relatório sai com esse aviso. Se for o primeiro mês de uso, informe abaixo uma taxa estimada; nos meses seguintes ela vem do fechamento do mês anterior.</p>' : ''}
    <div class="kpis" style="margin-bottom:12px">
      <div class="kpi big"><small>Taxa de estrutura</small><b>${c.taxa_estrutura == null ? 'não informada' : rs4(c.taxa_estrutura) + ' / cabeça'}</b></div>
      <div class="kpi"><small>Cabeças abatidas no mês</small><b>${num(cab)}</b></div>
      <div class="kpi"><small>Arrecadado pela taxa no mês</small><b>${brl(arr)}</b></div>
      <div class="kpi"><small>Valor que esta taxa precisa recuperar</small><b>${brl(alvo)}</b></div></div>
    ${c.fechada ? '' : `<form id="fTaxa" class="row"><label>Taxa de estrutura (R$ por cabeça) <input name="taxa_estrutura" type="number" step="0.0001" min="0" value="${c.taxa_estrutura ?? ''}" style="width:160px"></label>
      <button class="b sec">Salvar taxa</button><span class="mut">Altere à mão só no primeiro mês ou para uma correção combinada; nos demais, a taxa vem do fechamento anterior.</span></form>`}</div>

  <div class="card"><h2>Estrutura real deste mês ${c.fechada ? '(apurada no fechamento)' : '(prévia)'}</h2>
    <div class="scroll"><table style="max-width:760px">
      <tr><td>Mensalistas (${c.fechada ? 'valor do fechamento' : fixos.length + ' no cadastro de equipe'})</td><td class="n">${brl(mens)}</td><td>${c.fechada ? '' : '<button class="lnk" id="bIrEquipe">ver equipe</button>'}</td></tr>
      <tr><td>Despesas do mês (menu Despesas, categorias que entram na taxa)</td><td class="n">${brl(desp)}</td><td><button class="lnk" id="bIrDesp">ver despesas</button></td></tr>
      <tr><td>Energia e água fora dos dias de abate (conta real menos o medido nos dias)</td><td class="n">${eaInformada || c.fechada ? brl(ea) : '<span class="tag">conta não informada</span>'}</td><td></td></tr>
      <tr><td><b>Estrutura real do mês</b></td><td class="n"><b>${brl(real)}</b></td><td></td></tr>
      <tr><td>${pend >= 0 ? '(+) Faltou recuperar neste mês' : '(−) Sobrou da arrecadação deste mês'}</td><td class="n">${brl(Math.abs(pend))}</td><td class="mut">${brl(alvo)} a recuperar − ${brl(arr)} arrecadado</td></tr>
      <tr><td><b>A recuperar no mês seguinte</b></td><td class="n"><b>${brl(alvoProx)}</b></td><td></td></tr>
      <tr><td>Cabeças abatidas no mês</td><td class="n">${num(cab)}</td><td></td></tr></table></div>
    <div class="kpis" style="margin-top:12px"><div class="kpi big"><small>${c.fechada ? 'Taxa gravada para o mês seguinte' : 'Prévia da taxa do mês seguinte'}</small><b>${taxaProx == null ? '—' : rs4(taxaProx) + ' / cabeça'}</b></div></div>
    ${c.fechada ? '' : `<p class="mut" style="margin-top:10px">Para fechar o mês: todos os dias de produção fechados${abertos ? ` (há ${abertos} em aberto)` : ''}, todas as despesas lançadas e, de preferência, as contas de energia e água informadas abaixo. Mês fechado trava as despesas e os dias dele; só o administrador reabre.</p>`}</div>

  <div class="card"><h2>Contas reais de energia e água</h2>
    <p class="mut">Informe os valores das contas do mês. A diferença para o que já foi medido e cobrado nos dias de abate (câmara fria, dias sem produção, variação de tarifa) entra na estrutura do mês.</p>
    <div class="kpis" style="margin-bottom:12px"><div class="kpi"><small>Energia cobrada nos dias de abate</small><b>${brl(enDias)}</b></div><div class="kpi"><small>Água cobrada nos dias de abate</small><b>${brl(agDias)}</b></div></div>
    <form id="fContas"><div class="grid">${campos(F_CONTAS, c, c.fechada)}</div><p><button class="b sec" ${c.fechada ? 'disabled' : ''}>Salvar contas</button></p></form></div>

  <div class="card"><h2>Dias de abate do mês</h2><div class="scroll"><table>
    <tr><th>Data</th><th>Situação</th><th class="n">Cabeças</th><th class="n">Custo direto</th><th class="n">Estrutura</th><th class="n">Total do dia</th><th class="n">Por cabeça</th><th></th></tr>
    ${dias.map(x => `<tr><td>${dataBR(x.data)}</td><td><span class="tag ${fechadoDia(x.data) ? 'ok' : ''}">${fechadoDia(x.data) ? 'fechado' : 'aberto'}</span></td><td class="n">${num(x.cabecas_dia)}</td><td class="n">${brl(x.custo_direto)}</td><td class="n">${brl(x.custo_estrutura)}</td>
      <td class="n">${brl(x.custo_total)}</td><td class="n">${Number(x.cabecas_dia) ? num(x.custo_total / x.cabecas_dia, 4) : '—'}</td><td><button class="lnk" data-dia="${x.data}">abrir</button></td></tr>`).join('') || '<tr><td colspan="8" class="mut">Nenhum dia de produção no mês.</td></tr>'}
    </table></div></div>`;
  $('#mMes').onchange = e => { st.mes = e.target.value; render(); };
  const fT = $('#fTaxa');
  if (fT) fT.onsubmit = async e => { e.preventDefault(); try { const v = fT.elements.taxa_estrutura.value; await q(sb.from('competencias').update({ taxa_estrutura: v === '' ? null : Number(v) }).eq('competencia', comp)); render(); } catch (er) { falha(er); } };
  $('#fContas').onsubmit = async e => { e.preventDefault(); try { await q(sb.from('competencias').update(ler(e.target, F_CONTAS)).eq('competencia', comp)); render(); } catch (er) { falha(er); } };
  main.onclick = async e => { const t = e.target;
    try {

async function prepararComprovante(file) {

  main.innerHTML = abasCad() + `<div class="card row"><label>Produto <select id="eProd">${prods.map(p => `<option value="${p.codigo}" ${p.codigo === cod ? 'selected' : ''}>${esc(p.nome)}${st.ref.etiquetas.some(x => x.produto === p.codigo) ? '' : ' (sem etiqueta)'}</option>`).join('')}</select></label></div>
  <div class="card"><h2>Etiqueta · ${esc(nomeProduto(cod))}</h2>
    <form id="fEtq"><div class="grid">
      <label>Nome impresso <input name="nome_impresso" required value="${esc(m.nome_impresso)}"></label>
      <label>Peso líquido <input name="peso_liquido" required value="${esc(m.peso_liquido)}"></label>
      <label>Porções por embalagem <input name="porcoes_emb" value="${esc(m.porcoes_emb)}" placeholder="cerca de 10"></label>
      <label>Porção (g) <input name="porcao_g" type="number" step="0.01" value="${m.porcao_g ?? ''}"></label>
      <label>Medida caseira da porção <input name="porcao_desc" value="${esc(m.porcao_desc)}" placeholder="1 Fração"></label>
      <label>Validade resfriado (dias) <input name="validade_resfriado_dias" type="number" step="1" min="1" value="${m.validade_resfriado_dias ?? ''}"></label>
      <label>Validade congelado (dias) <input name="validade_congelado_dias" type="number" step="1" min="1" value="${m.validade_congelado_dias ?? ''}"></label></div>
    <h2 style="margin-top:16px">Informação nutricional</h2>
    <div class="scroll"><table style="max-width:640px"><tr><th>Item</th><th class="n">Por 100 g</th><th class="n">Por porção</th><th class="n">% VD</th></tr>
      ${NUT.map(([k, r]) => `<tr><td>${r}</td><td class="n"><input name="n_${k}" type="number" step="0.01" min="0" style="width:90px;text-align:right" value="${(n[k] || {}).v100 ?? ''}"></td><td class="n" data-porc="${k}"></td><td class="n"><input name="vd_${k}" type="number" step="0.01" min="0" style="width:80px;text-align:right" value="${(n[k] || {}).vd ?? ''}"></td></tr>`).join('')}</table></div>
    <p class="mut" style="margin:6px 0 0">O valor por porção é calculado (por 100 g × porção). <button type="button" class="lnk" id="bVd">Preencher % VD</button> usa o mesmo critério da etiqueta atual de sobrecoxa (valor por 100 g sobre o valor diário de referência); confira com o responsável técnico.</p>
    <h2 style="margin-top:16px">Código de barras por cooperado</h2>
    <p class="mut">Cada cooperado tem o seu próprio código (EAN-13) para este produto. A etiqueta de um lote sai com o código do cooperado dono do lote; sem código cadastrado, sai sem barras.</p>
    <div class="grid">${ativos('cooperados').map(c => `<label>${esc(c.nome)} <input name="ean_${c.id}" value="${esc(eanCoop(c.id))}" inputmode="numeric" maxlength="13"></label>`).join('')}</div>
    <p style="margin-top:14px"><button class="b">Salvar etiqueta</button></p></form></div>
  <div class="card"><h2>Pré-visualização (105 × 75 mm)</h2><div class="previa-etq" id="pvEtq"></div>
    <p class="mut" style="margin:8px 0 0">Lote, fabricação e validade são preenchidos na impressão, a partir do lote. Para imprimir: Dia de produção → "pesar" no lote → "etiquetas" na linha do produto.</p></div>`;
  const f = $('#fEtq');
  const ler1 = () => { const nut = {}; for (const [k] of NUT) { const v = f.elements['n_' + k].value, d = f.elements['vd_' + k].value; if (v !== '' || d !== '') nut[k] = { v100: v === '' ? null : Number(v), vd: d === '' ? null : Number(d) }; }
    const num1 = k => f.elements[k].value === '' ? null : Number(f.elements[k].value), txt = k => f.elements[k].value.trim() || null;
    return { produto:cod, nome_impresso:f.elements.nome_impresso.value.trim(), peso_liquido:f.elements.peso_liquido.value.trim(), porcoes_emb:txt('porcoes_emb'), porcao_g:num1('porcao_g'), porcao_desc:txt('porcao_desc'),
      nutrientes:nut, validade_resfriado_dias:num1('validade_resfriado_dias'), validade_congelado_dias:num1('validade_congelado_dias'), ean:null }; };
  const previa = () => { const o = ler1(), porc = o.porcao_g;
    for (const [k] of NUT) { const v = f.elements['n_' + k].value; main.querySelector(`[data-porc="${k}"]`).textContent = v === '' || !porc ? '' : nd(Number(v) * porc / 100); }
    $('#pvEtq').innerHTML = etiquetaHtml({ modelo:o, lote:hoje().replaceAll('-', '') + '-01', fab:hoje(), val:somaDias(hoje(), o.validade_congelado_dias || 365), ean:ativos('cooperados').map(c => f.elements['ean_' + c.id].value.trim()).find(eanValido) || '' }); };
  f.oninput = previa; previa();
  $('#eProd').onchange = e => { st.etqProd = e.target.value; render(); };
  $('#bVd').onclick = () => { for (const [k] of NUT) { const v = f.elements['n_' + k].value; if (v !== '' && VDR[k]) f.elements['vd_' + k].value = Math.round(Number(v) * 100 / VDR[k]); else if (v !== '' && Number(v) === 0) f.elements['vd_' + k].value = 0; } previa(); };
  f.onsubmit = async e => { e.preventDefault(); try {
    const o = ler1(), ruins = ativos('cooperados').map(c => f.elements['ean_' + c.id].value.trim()).filter(x => x && !eanValido(x));
    if (ruins.length) return alert(`Código de barras inválido: ${ruins.join(', ')}. O EAN-13 tem 13 dígitos e o último é verificador.`);
    await q(sb.from('etiquetas').upsert(o));
    for (const c of ativos('cooperados')) { const v = f.elements['ean_' + c.id].value.trim();
      if (v) await q(sb.from('etiqueta_eans').upsert({ cooperado_id:c.id, produto:cod, ean:v })); else if (eanCoop(c.id)) await q(sb.from('etiqueta_eans').delete().eq('cooperado_id', c.id).eq('produto', cod)); }
    await carregarRef(); render(); } catch (er) { falha(er); } };
  main.onclick = e => { if (e.target.dataset.cad) { st.cad = e.target.dataset.cad; render(); } };
}

// ───────── DADOS DO ESTABELECIMENTO ─────────
const F_ESTAB = [{ k:'razao_social', label:'Razão social' }, { k:'sigla', label:'Sigla' }, { k:'cnpj', label:'CNPJ' }, { k:'inscricao_estadual', label:'Inscrição estadual' }, { k:'registro_sie', label:'Registro no SIE' },
  { k:'registro_crmv', label:'Registro no CRMV' }, { k:'endereco', label:'Endereço (Unidade I · escritório)' }, { k:'endereco_industrial', label:'Endereço da unidade industrial' }, { k:'municipio_abate', label:'Município de abate' }, { k:'uf', label:'UF' }, { k:'ulsav', label:'ULSAV' },
  { k:'especie', label:'Espécie (como sai nos relatórios)' }, { k:'rt_nome', label:'Responsável técnico' }, { k:'rt_titulo', label:'Título do responsável técnico' }, { k:'rt_crmv', label:'CRMV do responsável técnico' }];
function telaEstab() {
  main.innerHTML = abasCad() + `<div class="card"><h2>Dados do estabelecimento</h2><p class="mut">Usados no cabeçalho do Mapa de Abate e no relatório de Ocorrências Sanitárias.</p>
    <form id="fEst"><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${campos(F_ESTAB, st.ref.estab)}</div><p><button class="b">Salvar</button></p></form></div>`;
  $('#fEst').onsubmit = async e => { e.preventDefault(); try { await q(sb.from('estabelecimento').upsert({ id:1, ...ler(e.target, F_ESTAB) })); await carregarRef(); render(); } catch (er) { falha(er); } };
  main.onclick = e => { if (e.target.dataset.cad) { st.cad = e.target.dataset.cad; render(); } };
}

// ───────── CADASTROS ─────────
const CAD = {
  cooperados:   { nome:'Cooperados', f:[{ k:'nome', label:'Nome', req:true }, { k:'documento', label:'CPF/CNPJ' }, { k:'telefone', label:'Telefone' }, { k:'propriedade', label:'Propriedade (granja)' }, { k:'municipio', label:'Município' }, { k:'uf', label:'UF', def:'PB' }, { k:'ativo', label:'Ativo', type:'checkbox' }] },
  motoristas:   { nome:'Motoristas', f:[{ k:'nome', label:'Nome', req:true }, { k:'ativo', label:'Ativo', type:'checkbox' }] },
  veiculos:     { nome:'Veículos', f:[{ k:'placa', label:'Placa', req:true }, { k:'descricao', label:'Descrição' }, { k:'tara_kg', label:'Tara (kg)', type:'number' }, { k:'ativo', label:'Ativo', type:'checkbox' }] },
  funcionarios: { nome:'Equipe', f:[{ k:'nome', label:'Nome', req:true }, { k:'cpf', label:'CPF' }, { k:'vinculo', label:'Vínculo', type:'select', req:true, options:() => [['diarista', 'Diarista'], ['fixo', 'Fixo (mensalista)']] },
                  { k:'funcao', label:'Função' }, { k:'valor_diaria', label:'Diária (R$)', type:'number' }, { k:'salario_mensal', label:'Custo mensal (R$)', type:'number' }, { k:'ativo', label:'Ativo', type:'checkbox' }] } };

const abasCad = () => `<div class="card row">${Object.entries(CAD).map(([k, v]) => `<button class="b ${k === st.cad ? '' : 'sec'}" data-cad="${k}">${v.nome}</button>`).join('')}<button class="b ${st.cad === 'rendimentos' ? '' : 'sec'}" data-cad="rendimentos">Rendimentos</button><button class="b ${st.cad === 'etiquetas' ? '' : 'sec'}" data-cad="etiquetas">Etiquetas</button><button class="b ${st.cad === 'estab' ? '' : 'sec'}" data-cad="estab">Estabelecimento</button></div>`;
async function telaRendimentos() {
  const tipos = st.ref.tipos_ave, reais = await q(sb.from('v_rendimento_real').select('*'));
  const realDe = (t, p) => reais.find(r => r.tipo_ave === t && r.produto === p);
  const celReal = (t, p) => { const r = realDe(t, p); return !r ? '' : `<div class="mut" style="font-size:11px;margin-top:2px">real ${num(r.pct_real, 2)}% em ${r.lotes} lote(s) <button class="lnk" data-adotar="${t}:${p}:${r.pct_real}">adotar</button></div>`; };
  main.innerHTML = abasCad() + `<div class="card"><h2>Rendimentos por produto (% do peso vivo)</h2>
    <p class="mut">Usados na previsão do plano de cortes. Valores iniciais da referência técnica Cobb500 Broiler Yield (ave de 2,73 kg, peso seco antes do chiller), conferidos com a Embrapa. Galetinho e frango caipira começam iguais ao frango grande e devem ser ajustados conforme a pesagem real do abatedouro. A alteração é gravada ao sair do campo.</p>
    <p class="mut">Abaixo de cada campo aparece o rendimento real medido nos lotes finalizados com pesagem de saída (kg pesados ÷ kg vivos destinados ao produto). "Adotar" troca a referência pelo valor real.</p>
    <div class="scroll"><table><tr><th>Produto</th>${tipos.map(t => `<th class="n">${esc(t.codigo)} · ${esc(t.nome)}</th>`).join('')}</tr>
    ${st.ref.produtos.map(p => `<tr><td>${esc(p.nome)}</td>${tipos.map(t => `<td class="n"><input type="number" step="0.01" min="0" max="100" style="width:90px;text-align:right" data-rend="${t.codigo}:${p.codigo}" value="${pctDe(t.codigo, p.codigo)}">${celReal(t.codigo, p.codigo)}</td>`).join('')}</tr>`).join('')}
    </table></div><p class="msg" id="rMsg" style="color:var(--pri)"></p></div>`;
  main.onclick = async e => { const t = e.target;
    if (t.dataset.cad) { st.cad = t.dataset.cad; render(); }
    if (t.dataset.adotar) { const [tipo_ave, produto, pct] = t.dataset.adotar.split(':');
      if (!confirm(`Trocar a referência de ${nomeProduto(produto)} (${tipo_ave}) para ${num(pct, 2)}%?`)) return;
      try { await q(sb.from('rendimentos').upsert({ tipo_ave, produto, pct:Number(pct) })); st.ref.rendimentos = await q(sb.from('rendimentos').select('*')); render(); } catch (er) { falha(er); } } };
  main.onchange = async e => { const t = e.target; if (!t.dataset.rend) return;
    const [tipo_ave, produto] = t.dataset.rend.split(':'), pct = Number(t.value);
    if (!(pct >= 0 && pct <= 100)) return alert('Informe um percentual entre 0 e 100.');
    try { await q(sb.from('rendimentos').upsert({ tipo_ave, produto, pct })); st.ref.rendimentos = await q(sb.from('rendimentos').select('*')); $('#rMsg').textContent = `Gravado: ${nomeProduto(produto)} (${tipo_ave}) = ${num(pct, 2)}%`; } catch (er) { falha(er); } };
}
function telaCad() {
  if (st.cad === 'rendimentos') return telaRendimentos();
  if (st.cad === 'etiquetas') return telaEtiquetas();
  if (st.cad === 'estab') return telaEstab();
  const c = CAD[st.cad], lista = st.ref[st.cad];
  const cel = (x, f) => f.type === 'checkbox' ? (x[f.k] ? 'sim' : 'não') : f.type === 'number' ? num(x[f.k], 2) : esc(x[f.k]);
  main.innerHTML = abasCad() + `
  <div class="card"><h2>${c.nome}</h2><div class="scroll"><table><tr>${c.f.map(f => `<th>${f.label}</th>`).join('')}<th></th></tr>
    ${lista.map(x => `<tr>${c.f.map(f => `<td>${cel(x, f)}</td>`).join('')}<td><button class="lnk" data-edit="${x.id}">editar</button></td></tr>`).join('') || `<tr><td colspan="${c.f.length + 1}" class="mut">Nenhum registro.</td></tr>`}</table></div>
    <h2 style="margin-top:16px" id="tCad">Novo registro</h2>
    <form id="fCad"><div class="grid">${campos(c.f)}</div><p><button class="b">Salvar</button> <button type="button" class="b sec" id="bCancel" hidden>Cancelar edição</button></p></form></div>`;
  let editando = null; const f = $('#fCad');
  f.onsubmit = async e => { e.preventDefault(); try {
    const o = ler(f, c.f); if (o.placa) o.placa = o.placa.toUpperCase().replace(/[^A-Z0-9]/g, ''); if ('cpf' in o) o.cpf = fmtCpf(o.cpf);
    if (editando) await q(sb.from(st.cad).update(o).eq('id', editando)); else await q(sb.from(st.cad).insert(o));
    await carregarRef(); render(); } catch (er) { falha(er); } };
  main.onclick = e => {
    const t = e.target;
    if (t.dataset.cad) { st.cad = t.dataset.cad; render(); }
    if (t.dataset.edit) { const x = lista.find(y => y.id === Number(t.dataset.edit)); editando = x.id; $('#tCad').textContent = 'Editando registro'; f.querySelector('.grid').innerHTML = campos(c.f, x); $('#bCancel').hidden = false; }
    if (t.id === 'bCancel') render();
  };
}

// ───────── USUÁRIOS (só administrador) ─────────
const PAPEL = { operador:'Operador', admin:'Administrador' };
async function telaUsuarios() {
  const us = await q(sb.from('usuarios').select('*').order('criado_em'));
  const eu = st.perfil.email, selPapel = (v, at = '') => `<select ${at}>${Object.entries(PAPEL).map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  main.innerHTML = `<div class="card"><h2>Usuários autorizados</h2><div class="scroll"><table>
    <tr><th>E-mail</th><th>Nome</th><th>Papel</th><th>Situação</th><th></th></tr>
    ${us.map(u => `<tr><td>${esc(u.email)}</td><td>${esc(u.nome)}</td>
      <td>${u.email === eu ? PAPEL[u.papel] : selPapel(u.papel, `data-papel="${esc(u.email)}"`)}</td>
      <td><span class="tag ${u.ativo ? 'ok' : ''}">${u.ativo ? 'ativo' : 'desativado'}</span></td>
      <td>${u.email === eu ? '<span class="mut">você</span>' : `<button class="lnk" data-ativo="${esc(u.email)}" data-v="${!u.ativo}">${u.ativo ? 'desativar' : 'reativar'}</button>`}</td></tr>`).join('')}
    </table></div>
    <h2 style="margin-top:16px">Autorizar novo usuário</h2>
    <form id="fUsu" class="row">
      <label>E-mail <input name="email" type="email" required></label>
      <label>Nome <input name="nome"></label>
      <label>Papel ${selPapel('operador', 'name="papel"')}</label>
      <button class="b">Autorizar</button></form>
    <p class="mut">Depois de autorizada, a pessoa abre o sistema, clica em "Primeiro acesso", cria a própria senha e confirma o e-mail. Operador lança e consulta tudo; Administrador também gerencia os usuários.</p></div>`;
  const f = $('#fUsu');
  f.onsubmit = async e => { e.preventDefault(); try {
    await q(sb.from('usuarios').insert({ email:f.elements.email.value.trim().toLowerCase(), nome:f.elements.nome.value.trim() || null, papel:f.elements.papel.value })); render(); } catch (er) { falha(er); } };
  main.onclick = async e => { const t = e.target; if (!t.dataset.ativo) return;
    try { await q(sb.from('usuarios').update({ ativo:t.dataset.v === 'true' }).eq('email', t.dataset.ativo)); render(); } catch (er) { falha(er); } };
  main.onchange = async e => { const t = e.target; if (!t.dataset.papel) return;
    try { await q(sb.from('usuarios').update({ papel:t.value }).eq('email', t.dataset.papel)); render(); } catch (er) { falha(er); } };
}

// ───────── navegação e sessão ─────────
async function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === st.tab));
  main.onclick = null; main.onchange = null;
  try { await ({ dia:telaDia, mes:telaMes, cam:telaCam, sie:telaSie, emb:telaEmb, desp:telaDesp, cad:telaCad, usu:telaUsuarios })[st.tab](); }
  catch (e) { main.innerHTML = `<div class="card"><p class="msg">Erro ao carregar: ${esc(e.message)}</p></div>`; }
}
$('#nav').onclick = e => { if (e.target.dataset.tab) { st.tab = e.target.dataset.tab; render(); } };
$('#bSair').onclick = () => sb.auth.signOut();
$('#fLogin').onsubmit = async e => {
  e.preventDefault(); $('#lMsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email:$('#lEmail').value.trim(), password:$('#lSenha').value });
  if (error) $('#lMsg').textContent = /not confirmed/i.test(error.message) ? 'Confirme seu e-mail antes de entrar (veja a caixa de entrada).' : 'E-mail ou senha inválidos.';
};
$('#bEsqueci').onclick = async () => {
  const m = $('#lMsg'), email = $('#lEmail').value.trim().toLowerCase(); m.style.color = '';
  if (!email) return m.textContent = 'Digite o seu e-mail no campo acima e clique de novo em "Esqueci a senha".';
  const { error } = await sb.auth.resetPasswordForEmail(email);
  if (error) return m.textContent = 'Não foi possível enviar o e-mail: ' + error.message;
  m.style.color = 'var(--pri)'; m.textContent = 'Se este e-mail tiver acesso, enviamos um link para criar uma nova senha. Confira a caixa de entrada e o spam.';
};
function telaNovaSenha() {
  $('#nav').hidden = true;
  main.innerHTML = `<div class="card" style="max-width:360px;margin:6vh auto"><h2>Criar nova senha</h2><form id="fNova">
    <label style="margin-bottom:10px">Nova senha (mínimo 8 caracteres) <input type="password" name="s1" required minlength="8" autocomplete="new-password"></label>
    <label style="margin-bottom:10px">Repita a senha <input type="password" name="s2" required minlength="8" autocomplete="new-password"></label>
    <button class="b">Salvar nova senha</button><p class="msg" id="nMsg"></p></form></div>`;
  const f = $('#fNova');
  f.onsubmit = async e => { e.preventDefault();
    if (f.elements.s1.value !== f.elements.s2.value) return $('#nMsg').textContent = 'As senhas não conferem.';
    const { error } = await sb.auth.updateUser({ password:f.elements.s1.value });
    if (error) return $('#nMsg').textContent = 'Não foi possível salvar: ' + error.message;
    alert('Senha alterada.'); location.href = location.pathname;
  };
}
const alterna = primeiro => { $('#fLogin').hidden = primeiro; $('#fPrimeiro').hidden = !primeiro; };
$('#bPrimeiro').onclick = () => alterna(true);
$('#bVoltar').onclick = () => alterna(false);
$('#fPrimeiro').onsubmit = async e => {
  e.preventDefault(); const m = $('#pMsg'); m.textContent = '';
  if ($('#pSenha').value !== $('#pSenha2').value) return m.textContent = 'As senhas não conferem.';
  const { data, error } = await sb.auth.signUp({ email:$('#pEmail').value.trim().toLowerCase(), password:$('#pSenha').value });
  if (error) return m.textContent = 'Não foi possível criar o acesso: ' + error.message;
  if (!data.session) { m.style.color = 'var(--pri)'; m.textContent = 'Enviamos um e-mail de confirmação. Abra-o, clique no link e depois entre com a sua senha.'; }
};
let logado;
sb.auth.onAuthStateChange((ev, sess) => {
  if (ev === 'PASSWORD_RECOVERY') { st.recuperar = true; if (logado) telaNovaSenha(); }
  const id = sess?.user?.id || null;
  if (id === logado) return; logado = id;
  $('#login').hidden = !!sess; $('#top').hidden = !sess; main.hidden = !sess;
  if (sess) setTimeout(async () => {
    try {
      const p = await q(sb.rpc('minha_autorizacao'));
      st.perfil = p && p.email ? p : null;
      $('#uEmail').textContent = st.perfil ? `${st.perfil.nome || st.perfil.email} · ${PAPEL[st.perfil.papel]}` : sess.user.email;
      $('#nav').hidden = !st.perfil; $('#nvUsu').hidden = !st.perfil || st.perfil.papel !== 'admin';
      if (st.recuperar) return telaNovaSenha();
      if (!st.perfil) return main.innerHTML = `<div class="card"><h2>Acesso não autorizado</h2><p>O e-mail <b>${esc(sess.user.email)}</b> ainda não foi autorizado a usar o sistema. Peça ao administrador para incluí-lo em "Usuários".</p></div>`;
      await carregarRef(); render();
    } catch (e) { falha(e); }
  }, 0);
});
</script>
</body>
</html>
