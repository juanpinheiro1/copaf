<!doctype html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<link rel="icon" href="logo.svg">
<title>Fort Aves · Gestão do Abatedouro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root { --bg:#f4f5f2; --card:#fff; --ink:#1d2a22; --mut:#66736b; --line:#dfe3dc; --pri:#0f8a41; --pri2:#e5f4eb; --warn:#b4541a; --err:#b3261e; --red:#ec1f27; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#fff; color:var(--ink); border-bottom:3px solid var(--pri); padding:8px 20px; display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
  header img { height:34px; display:block; }
  nav { display:flex; gap:4px; flex:1; }
  nav button { background:transparent; color:var(--ink); border:0; padding:8px 14px; border-radius:6px; font:inherit; cursor:pointer; }
  nav button.on { background:var(--pri); color:#fff; font-weight:600; }
  header .user { font-size:12px; color:var(--mut); }
  main { max-width:1180px; margin:0 auto; padding:18px 16px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px 12px; }
  label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--mut); }
  input, select { font:inherit; padding:7px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); min-width:0; }
  input:disabled, select:disabled { background:#f1f2ef; }
  button.b { font:inherit; padding:7px 14px; border-radius:6px; border:1px solid var(--pri); background:var(--pri); color:#fff; cursor:pointer; }
  button.b.sec { background:#fff; color:var(--pri); }
  button.b.warn { border-color:var(--warn); background:#fff; color:var(--warn); }
  button.lnk { background:none; border:0; color:var(--pri); cursor:pointer; font:inherit; padding:0 4px; text-decoration:underline; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { font-size:12px; color:var(--mut); font-weight:600; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .scroll { overflow-x:auto; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .kpi { background:var(--pri2); border-radius:8px; padding:10px 12px; }
  .kpi small { display:block; color:var(--mut); font-size:11px; }
  .kpi b { font-size:17px; font-variant-numeric:tabular-nums; }
  .kpi.big { background:var(--pri); color:#fff; } .kpi.big small { color:#cfe5d8; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; background:#fdecdc; color:var(--warn); }
  .tag.ok { background:var(--pri2); color:var(--pri); }
  .aviso { background:#fff6e9; border-color:#f0c48a; color:#7a3d0c; }
  .msg { color:var(--err); margin:8px 0 0; min-height:1em; }
  .mut { color:var(--mut); }
  #login { max-width:340px; margin:12vh auto; }
  #login label { margin-bottom:10px; }
  #rel { display:none; }
  @media print {
    header, main { display:none !important; }
    #rel { display:block; padding:0 8mm; color:#000; }
    #rel h1 { font-size:18px; margin:0; } #rel h2 { font-size:13px; margin:18px 0 6px; border-bottom:1px solid #000; padding-bottom:3px; }
    #rel td, #rel th { border-bottom:1px solid #bbb; padding:4px 6px; }
    #rel .tot td { font-weight:700; border-top:2px solid #000; }
    #rel .relaviso { border:2px solid #000; padding:8px 10px; margin:14px 0 0; }
  }
</style>
</head>
<body>
<div id="login" class="card" hidden>
  <img src="logo.svg" alt="Fort Aves" style="width:210px;display:block;margin:6px auto 4px">
  <p class="mut" style="text-align:center;margin:0 0 14px">Gestão do Abatedouro</p>
  <form id="fLogin">
    <label>E-mail <input type="email" id="lEmail" required autocomplete="username"></label>
    <label>Senha <input type="password" id="lSenha" required autocomplete="current-password"></label>
    <button class="b" type="submit">Entrar</button>
    <button class="lnk" type="button" id="bPrimeiro" style="margin-left:10px">Primeiro acesso</button>
    <button class="lnk" type="button" id="bEsqueci" style="margin-left:6px">Esqueci a senha</button>
    <p class="msg" id="lMsg"></p>
  </form>
  <form id="fPrimeiro" hidden>
    <p class="mut">Use o e-mail que o administrador autorizou e crie a sua senha. Você receberá um e-mail para confirmar o endereço.</p>
    <label>E-mail <input type="email" id="pEmail" required autocomplete="username"></label>
    <label>Senha (mínimo 8 caracteres) <input type="password" id="pSenha" required minlength="8" autocomplete="new-password"></label>
    <label>Repita a senha <input type="password" id="pSenha2" required minlength="8" autocomplete="new-password"></label>
    <button class="b" type="submit">Criar senha</button>
    <button class="lnk" type="button" id="bVoltar" style="margin-left:10px">Voltar</button>
    <p class="msg" id="pMsg"></p>
  </form>
</div>

<header id="top" hidden>
  <img src="logo.svg" alt="Fort Aves">
  <nav id="nav">
    <button data-tab="dia">Dia de produção</button>
    <button data-tab="mes">Fechamento mensal</button>
    <button data-tab="cad">Cadastros</button>
    <button data-tab="usu" id="nvUsu" hidden>Usuários</button>
  </nav>
  <span class="user"><span id="uEmail"></span> · <button class="lnk" id="bSair">sair</button></span>
</header>
<main id="main" hidden></main>
<div id="rel"></div>

<script>
const sb = supabase.createClient('https://kblrhzclhkqilcbcyqnr.supabase.co', 'sb_publishable_rMNN6YoURddBGLcs_fXs5g_LF7DJkwp');
const $ = (s, el = document) => el.querySelector(s);
const main = $('#main');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => v == null ? '—' : Number(v).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const num = (v, d = 0) => v == null ? '—' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits:d, maximumFractionDigits:d });
const dataBR = d => d ? d.split('-').reverse().join('/') : '';
const hoje = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const st = { perfil:null, tab:'dia', data:hoje(), mes:hoje().slice(0, 7), cad:'cooperados', ref:{} };

async function q(p) { const { data, error } = await p; if (error) throw new Error(error.message); return data; }
function falha(e) { alert('Erro: ' + e.message); }

// ───────── formulários genéricos ─────────
function campos(fields, v = {}, dis = false) {
  return fields.map(f => {
    const val = v[f.k] ?? f.def ?? '';
    const at = `name="${f.k}" ${f.req ? 'required' : ''} ${dis ? 'disabled' : ''}`;
    let inp;
    if (f.type === 'select')
      inp = `<select ${at}>${f.req ? '' : '<option value=""></option>'}${f.options().map(([o, l]) => `<option value="${esc(o)}" ${String(o) === String(val) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    else if (f.type === 'checkbox')
      inp = `<input type="checkbox" ${at} ${val === '' ? (f.def === false ? '' : 'checked') : (val ? 'checked' : '')} style="align-self:flex-start">`;
    else
      inp = `<input type="${f.type || 'text'}" ${f.type === 'number' ? `step="${f.step || 'any'}"` : ''} ${at} value="${esc(String(val).slice(0, f.type === 'time' ? 5 : undefined))}">`;
    return `<label>${esc(f.label)}${inp}</label>`;
  }).join('');
}
function ler(form, fields) {
  const o = {};
  for (const f of fields) {
    const el = form.elements[f.k];
    if (f.type === 'checkbox') o[f.k] = el.checked;
    else if (el.value === '') o[f.k] = f.zero ? 0 : null;
    else o[f.k] = (f.type === 'number' || f.int) ? Number(el.value) : el.value;
  }
  return o;
}

// ───────── referências ─────────
async function carregarRef() {
  const [co, mo, ve, fu, ta] = await Promise.all([
    q(sb.from('cooperados').select('*').order('nome')), q(sb.from('motoristas').select('*').order('nome')),
    q(sb.from('veiculos').select('*').order('placa')), q(sb.from('funcionarios').select('*').order('nome')),
    q(sb.from('tipos_ave').select('*').order('codigo'))]);
  st.ref = { cooperados:co, motoristas:mo, veiculos:ve, funcionarios:fu, tipos_ave:ta };
}
const nomeDe = (lista, id, campo = 'nome') => (st.ref[lista].find(x => x.id === id) || {})[campo] || '—';
const ativos = l => st.ref[l].filter(x => x.ativo !== false);

// ───────── DIA DE PRODUÇÃO ─────────
const F_DIA = [
  { k:'energia_ini', label:'Energia inicial (kWh)', type:'number' }, { k:'energia_fim', label:'Energia final (kWh)', type:'number' },
  { k:'tarifa_energia', label:'Tarifa energia (R$/kWh)', type:'number' },
  { k:'agua_ini', label:'Água inicial (m³)', type:'number' }, { k:'agua_fim', label:'Água final (m³)', type:'number' },
  { k:'tarifa_agua', label:'Tarifa água (R$/m³)', type:'number' }, { k:'observacao', label:'Observação' }];
const F_LOTE = [
  { k:'ordem', label:'Ordem no dia', type:'number', step:1, req:true },
  { k:'cooperado_id', label:'Cooperado', type:'select', int:true, req:true, options:() => ativos('cooperados').map(c => [c.id, c.nome]) },
  { k:'tipo_ave', label:'Tipo de ave', type:'select', req:true, options:() => st.ref.tipos_ave.map(t => [t.codigo, `${t.codigo} · ${t.nome}`]) },
  { k:'motorista_id', label:'Motorista', type:'select', int:true, options:() => ativos('motoristas').map(c => [c.id, c.nome]) },
  { k:'veiculo_id', label:'Veículo', type:'select', int:true, options:() => ativos('veiculos').map(c => [c.id, c.placa]) },
  { k:'peso_bruto_kg', label:'Peso bruto (kg)', type:'number' }, { k:'tara_kg', label:'Tara (kg)', type:'number' },
  { k:'qtd_caixas', label:'Qtd. de caixas', type:'number', step:1 }, { k:'aves_por_caixa', label:'Aves por caixa', type:'number', step:1 },
  { k:'mortos_chegada', label:'Mortos na chegada', type:'number', step:1, zero:true, def:0 },
  { k:'condenadas', label:'Condenadas (SIE)', type:'number', step:1, zero:true, def:0 },
  { k:'carcacas_contadas', label:'Carcaças contadas (sem pesagem)', type:'number', step:1 },
  { k:'velocidade_hz', label:'Velocidade (Hz)', type:'number' },
  { k:'hora_inicio', label:'Início', type:'time' }, { k:'hora_termino', label:'Término', type:'time' },
  { k:'minutos_parada', label:'Parada (min)', type:'number', step:1, zero:true, def:0 }, { k:'observacao', label:'Observação' }];

async function telaDia() {
  const d = st.data;
  const [dia, diaristas, custos, lotes, cd, cl] = await Promise.all([
    q(sb.from('dias_producao').select('*').eq('data', d).maybeSingle()),
    q(sb.from('dia_diaristas').select('*').eq('data', d).order('id')),
    q(sb.from('dia_custos').select('*').eq('data', d).order('id')),
    q(sb.from('lotes').select('*').eq('data', d).order('ordem')),
    q(sb.from('v_custo_dia').select('*').eq('data', d).maybeSingle()),
    q(sb.from('v_custo_lote').select('*').eq('data', d))]);
  const topo = `<div class="card row"><label>Data <input type="date" id="dData" value="${d}"></label>
    ${dia ? `<span class="tag ${dia.fechado ? 'ok' : ''}">${dia.fechado ? 'Dia fechado' : 'Dia em aberto'}</span>
      <button class="b ${dia.fechado ? 'warn' : ''}" id="bFechar">${dia.fechado ? 'Reabrir dia' : 'Fechar dia'}</button>` : ''}</div>`;
  if (!dia) {
    main.innerHTML = topo + `<div class="card"><p>Nenhum dia de produção aberto em <b>${dataBR(d)}</b>.</p><button class="b" id="bAbrir">Abrir dia de produção</button></div>`;
    $('#dData').onchange = e => { st.data = e.target.value; render(); };
    $('#bAbrir').onclick = abrirDia;
    return;
  }
  const fx = dia.fechado, porCab = cd.cabecas_dia ? cd.custo_total / cd.cabecas_dia : null, semMensal = !Number(cd.parcela_custos_mensais);
  const custoLote = id => (cl.find(x => x.lote_id === id) || {}).custo_lote;
  main.innerHTML = topo + `
  ${semMensal ? `<div class="card aviso">Os custos fixos mensais de ${d.slice(5, 7)}/${d.slice(0, 4)} ainda não foram informados. O custo abaixo traz <b>somente os custos do dia</b> (diaristas, energia, água, limpeza e outros). <button class="lnk" id="bIrMes">Informar custos fixos do mês</button></div>` : ''}
  <div class="card"><h2>Custo do dia</h2><div class="kpis">
    <div class="kpi"><small>Diaristas</small><b>${brl(cd.custo_diaristas)}</b></div>
    <div class="kpi"><small>Energia</small><b>${brl(cd.custo_energia)}</b></div>
    <div class="kpi"><small>Água</small><b>${brl(cd.custo_agua)}</b></div>
    <div class="kpi"><small>Limpeza</small><b>${brl(cd.custo_limpeza)}</b></div>
    <div class="kpi"><small>Outros</small><b>${brl(cd.custo_outros)}</b></div>
    <div class="kpi"><small>Diária dos custos fixos mensais</small><b>${semMensal ? 'não informada' : brl(cd.parcela_custos_mensais)}</b></div>
    <div class="kpi"><small>Cabeças pagantes</small><b>${num(cd.cabecas_dia)}</b></div>
    <div class="kpi big"><small>Custo total do dia</small><b>${brl(cd.custo_total)}</b></div>
    <div class="kpi big"><small>Custo por cabeça</small><b>${porCab == null ? '—' : num(porCab, 4)}</b></div>
  </div></div>

  <div class="card"><h2>Medidores</h2><form id="fDia"><div class="grid">${campos(F_DIA, dia, fx)}</div>
    <p><button class="b" ${fx ? 'disabled' : ''}>Salvar medidores</button></p></form></div>

  <div class="card"><h2>Diaristas do dia</h2><div class="scroll"><table>
    <tr><th>Nome</th><th>Função</th><th class="n">Valor</th><th></th></tr>
    ${diaristas.map(x => `<tr><td>${esc(nomeDe('funcionarios', x.funcionario_id))}</td><td>${esc(x.funcao)}</td><td class="n">${brl(x.valor)}</td>
      <td>${fx ? '' : `<button class="lnk" data-del="dia_diaristas:${x.id}">remover</button>`}</td></tr>`).join('') || '<tr><td colspan="4" class="mut">Nenhum diarista lançado.</td></tr>'}
    </table></div>
    <form id="fDiarista" class="row" style="margin-top:10px">
      <label>Diarista <select name="funcionario_id" required ${fx ? 'disabled' : ''}><option value=""></option>${ativos('funcionarios').filter(f => f.vinculo === 'diarista').map(f => `<option value="${f.id}" data-v="${f.valor_diaria ?? ''}" data-f="${esc(f.funcao)}">${esc(f.nome)}</option>`).join('')}</select></label>
      <label>Função <input name="funcao" ${fx ? 'disabled' : ''}></label>
      <label>Valor (R$) <input name="valor" type="number" step="0.01" required ${fx ? 'disabled' : ''}></label>
      <button class="b sec" ${fx ? 'disabled' : ''}>Adicionar</button></form></div>

  <div class="card"><h2>Limpeza e outros custos do dia</h2><div class="scroll"><table>
    <tr><th>Categoria</th><th>Descrição</th><th class="n">Valor</th><th></th></tr>
    ${custos.map(x => `<tr><td>${x.categoria === 'limpeza' ? 'Limpeza' : 'Outros'}</td><td>${esc(x.descricao)}</td><td class="n">${brl(x.valor)}</td>
      <td>${fx ? '' : `<button class="lnk" data-del="dia_custos:${x.id}">remover</button>`}</td></tr>`).join('') || '<tr><td colspan="4" class="mut">Nenhum custo lançado.</td></tr>'}
    </table></div>
    <form id="fCusto" class="row" style="margin-top:10px">
      <label>Categoria <select name="categoria" ${fx ? 'disabled' : ''}><option value="limpeza">Limpeza</option><option value="outros">Outros</option></select></label>
      <label>Descrição <input name="descricao" ${fx ? 'disabled' : ''}></label>
      <label>Valor (R$) <input name="valor" type="number" step="0.01" required ${fx ? 'disabled' : ''}></label>
      <button class="b sec" ${fx ? 'disabled' : ''}>Adicionar</button></form></div>

  <div class="card"><h2>Lotes do dia</h2><div class="scroll"><table>
    <tr><th>Lote</th><th>Cooperado</th><th>Ave</th><th class="n">Peso líq. (kg)</th><th class="n">Aves</th><th class="n">Média (kg)</th><th class="n">Mortos</th><th class="n">Cond.</th><th class="n">Cabeças pagantes</th><th class="n">Custo do lote</th><th></th></tr>
    ${lotes.map(l => `<tr><td>${esc(l.codigo)}</td><td>${esc(nomeDe('cooperados', l.cooperado_id))}</td><td>${esc(l.tipo_ave)}</td>
      <td class="n">${l.peso_liquido_kg == null ? '<span class="tag">sem pesagem</span>' : num(l.peso_liquido_kg, 0)}</td>
      <td class="n">${num(l.aves_recebidas)}</td><td class="n">${l.peso_liquido_kg && l.aves_recebidas ? num(l.peso_liquido_kg / l.aves_recebidas, 2) : '—'}</td>
      <td class="n">${num(l.mortos_chegada)}</td><td class="n">${num(l.condenadas)}</td><td class="n">${num(l.cabecas_pagantes)}</td>
      <td class="n"><b>${brl(custoLote(l.id))}</b></td>
      <td><button class="lnk" data-rel="${l.id}">relatório</button>${fx ? '' : `<button class="lnk" data-edit="${l.id}">editar</button><button class="lnk" data-del="lotes:${l.id}">excluir</button>`}</td></tr>`).join('') || '<tr><td colspan="11" class="mut">Nenhum lote lançado.</td></tr>'}
    </table></div>
    <h2 style="margin-top:16px" id="tLote">Novo lote</h2>
    <form id="fLote"><div class="grid">${campos(F_LOTE, { ordem: (lotes.at(-1)?.ordem || 0) + 1 }, fx)}</div>
      <p><button class="b" ${fx ? 'disabled' : ''}>Salvar lote</button> <button type="button" class="b sec" id="bLimpar" hidden>Cancelar edição</button></p></form></div>`;

  $('#dData').onchange = e => { st.data = e.target.value; render(); };
  $('#bFechar').onclick = async () => {
    if (!fx && !confirm(`Fechar o dia ${dataBR(d)}? Os lançamentos ficam bloqueados para edição.`)) return;
    try { await q(sb.from('dias_producao').update({ fechado:!fx, fechado_em: fx ? null : new Date().toISOString() }).eq('data', d)); render(); } catch (e) { falha(e); }
  };
  $('#fDia').onsubmit = async e => { e.preventDefault(); try { await q(sb.from('dias_producao').update(ler(e.target, F_DIA)).eq('data', d)); render(); } catch (er) { falha(er); } };
  const fD = $('#fDiarista');
  fD.elements.funcionario_id.onchange = e => { const o = e.target.selectedOptions[0]; fD.elements.valor.value = o.dataset.v || ''; fD.elements.funcao.value = o.dataset.f || ''; };
  fD.onsubmit = async e => { e.preventDefault(); try {
    await q(sb.from('dia_diaristas').insert({ data:d, funcionario_id:Number(fD.elements.funcionario_id.value), funcao:fD.elements.funcao.value || null, valor:Number(fD.elements.valor.value) })); render(); } catch (er) { falha(er); } };
  const fC = $('#fCusto');
  fC.onsubmit = async e => { e.preventDefault(); try {
    await q(sb.from('dia_custos').insert({ data:d, categoria:fC.elements.categoria.value, descricao:fC.elements.descricao.value || null, valor:Number(fC.elements.valor.value) })); render(); } catch (er) { falha(er); } };

  const fL = $('#fLote'); let editando = null;
  fL.elements.veiculo_id.onchange = e => { const v = st.ref.veiculos.find(x => x.id === Number(e.target.value)); if (v && v.tara_kg != null && !fL.elements.tara_kg.value) fL.elements.tara_kg.value = v.tara_kg; };
  fL.onsubmit = async e => { e.preventDefault(); try {
    const o = ler(fL, F_LOTE);
    if (o.carcacas_contadas == null && (o.qtd_caixas == null || o.aves_por_caixa == null)) return alert('Informe caixas e aves por caixa, ou as carcaças contadas.');
    if (editando) await q(sb.from('lotes').update(o).eq('id', editando));
    else await q(sb.from('lotes').insert({ ...o, data:d, codigo:`${d.replaceAll('-', '')}-${String(o.ordem).padStart(2, '0')}` }));
    render(); } catch (er) { falha(er); } };
  main.onclick = async e => {
    const t = e.target;
    if (t.dataset.del) { const [tab, id] = t.dataset.del.split(':'); if (!confirm('Confirma a exclusão deste lançamento?')) return;
      try { await q(sb.from(tab).delete().eq('id', id)); render(); } catch (er) { falha(er); } }
    if (t.dataset.edit) { const l = lotes.find(x => x.id === Number(t.dataset.edit)); editando = l.id;
      $('#tLote').textContent = 'Editando lote ' + l.codigo; fL.querySelector('.grid').innerHTML = campos(F_LOTE, l); $('#bLimpar').hidden = false; fL.scrollIntoView({ behavior:'smooth' }); }
    if (t.id === 'bLimpar') render();
    if (t.id === 'bIrMes') { st.mes = d.slice(0, 7); st.tab = 'mes'; render(); }
    if (t.dataset.rel) relatorio(lotes.find(x => x.id === Number(t.dataset.rel)), cd, lotes, custoLote);
  };
}

async function abrirDia() {

// ───────── RELATÓRIO DO LOTE (impressão / PDF) ─────────
function relatorio(l, cd, lotes, custoLote) {

  const linha = (nome, v) => `<tr><td>${nome}</td><td class="n">${brl(v)}</td><td class="n">${brl(v * part)}</td></tr>`;
  $('#rel').innerHTML = `
    <img src="logo.svg" alt="Fort Aves" style="height:48px"><p>Abatedouro · Relatório de custo operacional do lote</p>
    <h2>Lote ${esc(l.codigo)}</h2>

      <tr><td>Tipo de ave</td><td>${esc((st.ref.tipos_ave.find(t => t.codigo === l.tipo_ave) || {}).nome || l.tipo_ave)}</td><td>Veículo / motorista</td><td>${esc(nomeDe('veiculos', l.veiculo_id, 'placa'))} / ${esc(nomeDe('motoristas', l.motorista_id))}</td></tr>
      <tr><td>Peso bruto / tara</td><td>${l.peso_bruto_kg == null ? 'sem pesagem' : `${num(l.peso_bruto_kg)} / ${num(l.tara_kg)} kg`}</td><td>Peso líquido</td><td>${l.peso_liquido_kg == null ? '—' : num(l.peso_liquido_kg) + ' kg'}</td></tr>
      <tr><td>Aves recebidas</td><td>${num(l.aves_recebidas)}</td><td>Peso médio</td><td>${l.peso_liquido_kg && l.aves_recebidas ? num(l.peso_liquido_kg / l.aves_recebidas, 2) + ' kg' : '—'}</td></tr>
      <tr><td>Mortos na chegada</td><td>${num(l.mortos_chegada)}</td><td>Condenadas (SIE)</td><td>${num(l.condenadas)}</td></tr>
      <tr><td>Cabeças pagantes</td><td><b>${num(l.cabecas_pagantes)}</b>${l.carcacas_contadas != null ? ' (contagem de carcaças)' : ''}</td><td>Horário</td><td>${(l.hora_inicio || '').slice(0, 5)} – ${(l.hora_termino || '').slice(0, 5)}</td></tr></table>
    <h2>Custo operacional do dia e parcela do lote</h2>
    <p>Cabeças abatidas no dia: ${num(cd.cabecas_dia)} em ${lotes.length} lote(s). Participação deste lote: ${num(part * 100, 2)}%.</p>
    <table><tr><th>Item</th><th class="n">Custo do dia</th><th class="n">Parcela do lote</th></tr>
      ${linha('Mão de obra (diaristas)', cd.custo_diaristas)}${linha('Energia elétrica', cd.custo_energia)}${linha('Água', cd.custo_agua)}
      ${linha('Limpeza', cd.custo_limpeza)}${linha('Outros custos do dia', cd.custo_outros)}${semMensal ? '<tr><td>Custos fixos mensais (equipe fixa, manutenção, materiais)</td><td class="n" colspan="2">não incluídos</td></tr>' : linha('Custos fixos mensais (equipe fixa, manutenção, materiais)', cd.parcela_custos_mensais)}
      <tr class="tot"><td>Total</td><td class="n">${brl(cd.custo_total)}</td><td class="n">${brl(custoLote(l.id))}</td></tr></table>
    ${semMensal ? '<p class="relaviso"><b>Atenção:</b> este custo não inclui os componentes de despesas fixas mensais do abatedouro (equipe fixa, manutenção e materiais de limpeza), que ainda não foram apurados para o mês. O valor abaixo corresponde somente aos custos do dia do abate.</p>' : ''}
    <h2>${semMensal ? 'Valor parcial (custos do dia)' : 'Valor a pagar'}</h2>
    <p>${num(l.cabecas_pagantes)} cabeças × R$ ${num(porCab, 4)} por cabeça = <b>${brl(custoLote(l.id))}</b></p>
    <p style="font-size:11px">Energia e água são apuradas no dia pela leitura dos medidores e pela tarifa da última conta. A diferença para a conta real do mês é rateada por cabeça abatida no fechamento mensal e informada em relatório complementar.</p>
    <p style="font-size:11px">Emitido em ${new Date().toLocaleString('pt-BR')}.</p>`;
  window.print();
}

  const { data, error } = await sb.auth.signUp({ email:$('#pEmail').value.trim().toLowerCase(), password:$('#pSenha').value });
  if (error) return m.textContent = 'Não foi possível criar o acesso: ' + error.message;
  if (!data.session) { m.style.color = 'var(--pri)'; m.textContent = 'Enviamos um e-mail de confirmação. Abra-o, clique no link e depois entre com a sua senha.'; }
};
let logado;
sb.auth.onAuthStateChange((ev, sess) => {
  if (ev === 'PASSWORD_RECOVERY') { st.recuperar = true; if (logado) telaNovaSenha(); }
  const id = sess?.user?.id || null;
  if (id === logado) return; logado = id;
  $('#login').hidden = !!sess; $('#top').hidden = !sess; main.hidden = !sess;
  if (sess) setTimeout(async () => {
    try {
      const p = await q(sb.rpc('minha_autorizacao'));
      st.perfil = p && p.email ? p : null;
      $('#uEmail').textContent = st.perfil ? `${st.perfil.nome || st.perfil.email} · ${PAPEL[st.perfil.papel]}` : sess.user.email;
      $('#nav').hidden = !st.perfil; $('#nvUsu').hidden = !st.perfil || st.perfil.papel !== 'admin';
      if (st.recuperar) return telaNovaSenha();
      if (!st.perfil) return main.innerHTML = `<div class="card"><h2>Acesso não autorizado</h2><p>O e-mail <b>${esc(sess.user.email)}</b> ainda não foi autorizado a usar o sistema. Peça ao administrador para incluí-lo em "Usuários".</p></div>`;
      await carregarRef(); render();
    } catch (e) { falha(e); }
  }, 0);
});
</script>
</body>
</html>
